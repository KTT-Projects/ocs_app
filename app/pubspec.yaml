name: ocs_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^4.0.4
  intl: ^0.19.0
  http: ^0.13.6
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  image_picker: ^1.0.7
  image_picker_web: ^3.1.1
  file_picker: ^8.0.5
  flutter_linkify: ^6.0.0
  url_launcher: ^6.2.6
  path_provider: ^2.1.5
  gallery_saver: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  # assets:
  #   - lib/images/

dependency_overrides:
  # flutter_localizations (SDK) pins intl 0.20.2 on current Flutter.
  # Keep declared app constraint at ^0.19.0 per project requirement.
  intl: 0.20.2
